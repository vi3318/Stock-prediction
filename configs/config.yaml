# Data configuration
data:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  news_sources:
    - newsapi
    - yahoo_finance
    - finviz
  max_news_per_day: 50
  cache_embeddings: true

# NLP configuration
nlp:
  model_name: "ProsusAI/finbert"
  max_sequence_length: 512
  batch_size: 32
  entity_model: "en_core_web_sm"
  relation_extraction: true
  event_types:
    - earnings
    - merger
    - acquisition
    - partnership
    - lawsuit
    - product_launch
    - regulatory

# Temporal relevance
temporal:
  # Traditional manual weights (baseline)
  decay_function: "exponential"  # exponential, linear, or step
  half_life_days: 3
  max_history_days: 30
  event_weight_multipliers:
    earnings: 2.0
    merger: 2.5
    acquisition: 2.5
    partnership: 1.5
    lawsuit: 1.8
    product_launch: 1.3
    regulatory: 1.7
  
  # Learnable temporal parameters (ENHANCED - Task 3)
  use_learnable_weights: true  # Set to true to use learnable parameters
  learnable_config:
    # Initial values for warm start (optional)
    initial_event_weights:
      earnings: 2.0
      merger: 2.5
      acquisition: 2.5
      partnership: 1.5
      lawsuit: 1.8
      product_launch: 1.3
      regulatory: 1.7
      dividend: 1.2
      ceo_change: 1.6
      restructuring: 1.4
    initial_half_life: 3.0
    # Regularization to encourage sparse weights
    l1_regularization: 0.01
    # Visualization settings
    visualize_every_n_epochs: 5
    save_weight_evolution: true

# Feature engineering
features:
  technical_indicators:
    - SMA_10
    - SMA_20
    - EMA_10
    - RSI_14
    - MACD
    - Bollinger_Bands
    - ATR
    - Volume_Change
  lookback_window: 30
  prediction_horizon: 1  # days ahead
  
# Model architecture
model:
  type: "late_fusion"  # late_fusion or early_fusion
  text_encoder:
    name: "finbert_lstm"
    lstm_units: 128
    lstm_layers: 2
    dropout: 0.3
    attention: true
    attention_heads: 4
  numerical_encoder:
    name: "gru"
    gru_units: 64
    gru_layers: 2
    dropout: 0.2
  fusion:
    dense_layers: [128, 64]
    dropout: 0.4
    activation: "relu"
  output:
    task: "classification"  # classification or regression
    classes: 3  # down, neutral, up (or 2 for binary)

# Training configuration
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  optimizer: "adam"
  loss: "categorical_crossentropy"
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
  early_stopping:
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"
  validation_split: 0.2
  test_split: 0.1
  class_weights: "balanced"
  
# Evaluation
evaluation:
  metrics:
    classification:
      - accuracy
      - precision
      - recall
      - f1_score
      - confusion_matrix
    regression:
      - rmse
      - mae
      - mape
    trading:
      - sharpe_ratio
      - max_drawdown
      - cumulative_return
      - win_rate
  backtesting:
    initial_capital: 100000
    transaction_cost: 0.001
    confidence_threshold: 0.6

# Explainability
explainability:
  enable_shap: true
  enable_attention_viz: true
  num_samples_shap: 100
  save_visualizations: true

# Paths
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_cache: "data/cache"
  models: "models/saved_models"
  logs: "logs"
  results: "results"
  visualizations: "visualizations"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true

# Random seed for reproducibility
random_seed: 42
